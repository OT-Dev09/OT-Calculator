<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>

<body class="bg-info-subtle min-vh-100">
    <div class="col-11 col-md-8 col-lg-5 mx-auto my-5 p-4 bg-white rounded-5 shadow">
        <h1 class="text-center text-primary-emphasis mb-4">🧸 OT Calculator</h1>
        <div id="display"
            class="bg-warning-subtle border border-3 border-warning-subtle rounded-4 p-3 mb-4 text-center">
            Your Result will be displayed here!
        </div>
        <input id="input1" type="number" placeholder="write your first input here"
            class="form-control rounded-pill border-3 border-info-subtle mb-3">
        <select name="" id="op" class="form-select rounded-pil border-3 border-primary-subtle text-center mb-3">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input id="input2" type="number" placeholder="write your second input here"
            class="form-control rounded-pill border-3 border-info-subtle mb-4">
        <button class="btn btn-primary btn-lg rounded-pill w-100" onclick="pressMe()">Calculate ✨</button>
    </div>

    <script>
        const results = []
        const colors = ['bg-danger-subtle', 'bg-info-subtle', 'bg-success-subtle', 'bg-primary-subtle']
        function pressMe() {
            const firstInput = Number(document.getElementById('input1').value);
            const secondInput = Number(document.getElementById('input2').value);
            const displayArea = document.getElementById('display')
            const operators = document.getElementById('op').value;

            let result;
            if (operators === '+') result = firstInput + secondInput;
            else if (operators === '-') result = firstInput - secondInput;
            else if (operators === '*') result = firstInput * secondInput;
            else if (operators === '/') result = secondInput === 0 ? "Cannot Divide By 0" : firstInput / secondInput;

            results.push(result);
            document.getElementById('display').innerHTML = ''
            document.getElementById('input1').value = ''
            document.getElementById('input2').value = ''
            for (let i = 0; i < results.length; i++) {
                document.getElementById('display').innerHTML += `<p class='${colors[i % 4]} rounded-pill px-3 py-1 mb-2 text-start'>${i + 1}. ${results[i]}</p>`
            }

        }
    </script>

</body>

</html>
